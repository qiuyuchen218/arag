# ARAG Configuration Example
# API credentials should be set via environment variables:
#   ARAG_API_KEY, ARAG_BASE_URL, ARAG_MODEL

llm:
  # Model settings (can override env vars)
  # model: "gpt-4o-mini"
  # api_key: "your-api-key"
  # base_url: "https://api.openai.com/v1"
  temperature: 0.0
  max_tokens: 16384
  reasoning_effort: "medium"  # For reasoning models (o1, etc.)

# embedding:
#   # HuggingFace model name or local model path
#   # We use Qwen3-Embedding-0.6B in our paper
#   model: "Qwen/Qwen3-Embedding-0.6B"
#   # model: "/path/to/local/Qwen3-Embedding-0.6B"
#   device: "cuda:0"  # or "cpu"
#   batch_size: 16
embedding:
  model: "/home/qiu.yc/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-0.6B/snapshots/97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
  device: "cuda:0"
  batch_size: 16
agent:
  max_loops: 15
  max_token_budget: 128000
  verbose: false

# data:
#   chunks_file: "data/chunks.json"
#   questions_file: "data/questions.json"
#   index_dir: "data/index"

data:
  chunks_file: "data/musique/chunks.json"
  questions_file: "data/musique/questions.json"
  index_dir: "data/musique/index"
  
output:
  results_dir: "results/"

trace:
  schema_version: "2.0"
  save_html: true
  record_context_text: true

verification:
  enabled: false
  mode: "fake_test"  # fake_test | real_uncalibrated | real_calibrated
  backend: "fake"  # backward-compatible alias: fake | llm
  model: null
  timeout: 60
  max_retries: 2
  max_evidence_set_size: 3
  verified_threshold: 0.80
  low_support_threshold: 0.45
  contradiction_threshold: 0.70
  uncertainty_threshold: 0.65
  relevance_threshold: 0.50
  prompt_token_budget: 4096
  weights:
    beta: 1.5
    gamma: 1.0
    delta: 1.0
    rho: 0.3
    kappa: 0.2
    mu: 0.5

repair:
  enabled: false
  dry_run: true
  max_branches: 2
  max_cost: null
  min_blame: 0.20
  min_expected_gain: 0.10
