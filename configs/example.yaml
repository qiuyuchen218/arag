# ARAG Configuration Example
# API credentials should be set via environment variables:
#   ARAG_API_KEY, ARAG_BASE_URL, ARAG_MODEL

llm:
  # Model settings (can override env vars)
  # model: "gpt-4o-mini"
  # api_key: "your-api-key"
  # base_url: "https://api.openai.com/v1"
  temperature: 0.0
  max_tokens: 16384
  reasoning_effort: "medium"  # For reasoning models (o1, etc.)

# embedding:
#   # HuggingFace model name or local model path
#   # We use Qwen3-Embedding-0.6B in our paper
#   model: "Qwen/Qwen3-Embedding-0.6B"
#   # model: "/path/to/local/Qwen3-Embedding-0.6B"
#   device: "cuda:0"  # or "cpu"
#   batch_size: 16
embedding:
  model: "/home/qiu.yc/.cache/huggingface/hub/models--Qwen--Qwen3-Embedding-0.6B/snapshots/97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
  device: "cuda:0"
  batch_size: 16
agent:
  max_loops: 15
  max_token_budget: 128000
  verbose: false

# data:
#   chunks_file: "data/chunks.json"
#   questions_file: "data/questions.json"
#   index_dir: "data/index"

data:
  chunks_file: "data/musique/chunks.json"
  questions_file: "data/musique/questions.json"
  index_dir: "data/musique/index"
  
output:
  results_dir: "results/"
